mkdir public
cat << 'EOF' > public/index.html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Waste Kitchen</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f9f4; color: #333; }
    h1 { color: #2e7d32; }
    input, button { padding: 10px; font-size: 16px; margin-right: 5px; }
    button { background: #2e7d32; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .receta { background: white; padding: 15px; margin-top: 10px; border-radius: 6px; border-left: 5px solid #2e7d32; }
  </style>
</head>
<body>
  <h1>Zero-Waste Kitchen</h1>
  <p>Ingresa los ingredientes que tienes en tu nevera (separados por coma):</p>
  <input type="text" id="ingredientesInput" placeholder="ej. huevo, papas, banana">
  <button onclick="buscar()">Buscar Recetas</button>
  <div id="resultados"></div>
  <script>
    async function buscar() {
      const input = document.getElementById('ingredientesInput').value;
      const lista = input.split(',').map(item => item.trim().toLowerCase());
      const res = await fetch('/api/buscar-recetas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ misIngredientes: lista })
      });
      const data = await res.json();
      const contenedor = document.getElementById('resultados');
      contenedor.innerHTML = '';
      if (data.resultados.length === 0) {
        contenedor.innerHTML = '<p>No se encontraron recetas con esos ingredientes.</p>';
        return;
      }
      data.resultados.forEach(r => {
        contenedor.innerHTML += `
          <div class="receta">
            <h3>${r.nombre}</h3>
            <p><strong>Ingredientes:</strong> ${r.ingredientes.join(', ')}</p>
            <p><strong>Pasos:</strong> ${r.pasos}</p>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
EOF
